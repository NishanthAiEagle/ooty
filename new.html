<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ooty AR Smart Concierge</title>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --gold: #d4af37;
      --gold-soft: #f3e5ab;
      --forest: #081c10;
      --forest-mid: #0d2818;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
    }

    /* PREVENTS RAW HTML VIDEO FROM RENDERING ON SCREEN */
    video#arVideo {
      display: none !important;
      visibility: hidden !important;
      position: absolute !important;
      top: -99999px !important;
      left: -99999px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Screen UI Overlay */
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      pointer-events: none;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
      opacity: 0;
      animation: uiFadeIn 0.8s ease forwards 0.2s;
    }

    @keyframes uiFadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .scan-pill {
      position: relative;
      background: rgba(8, 28, 16, 0.9);
      border: 1.5px solid var(--gold);
      color: var(--gold-soft);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: background 0.4s ease, border-color 0.4s ease, transform 0.3s ease;
      overflow: hidden;
      animation: pillBreathe 2.4s ease-in-out infinite;
    }

    /* Soft breathing glow while searching for the card */
    @keyframes pillBreathe {
      0%, 100% { box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 0 rgba(212,175,55,0.0); }
      50%      { box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 14px rgba(212,175,55,0.45); }
    }

    .scan-pill.locked {
      animation: lockedPulse 1.1s ease-out 1;
    }

    @keyframes lockedPulse {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.12); }
      60%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    /* Traveling sheen across the pill border */
    .scan-pill::after {
      content: "";
      position: absolute;
      top: 0; left: -60%;
      width: 40%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(243,229,171,0.35), transparent);
      transform: skewX(-20deg);
      animation: sheen 3.2s ease-in-out infinite;
    }

    @keyframes sheen {
      0%   { left: -60%; }
      60%  { left: 130%; }
      100% { left: 130%; }
    }

    /* Screen fallback dock for Maps navigation */
    #active-info-bar {
      position: fixed;
      bottom: 24px;
      background: rgba(8, 28, 16, 0.95);
      border: 1.5px solid var(--gold);
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(60px) scale(0.96);
      transition: transform 0.45s cubic-bezier(.34,1.56,.64,1), opacity 0.35s ease;
    }

    #active-info-bar.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #info-title {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    #info-time {
      font-size: 11px;
      color: #b4c2b8;
      transition: opacity 0.3s ease;
    }

    .btn-maps {
      background: #258cfb;
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }

    .btn-maps:active {
      transform: scale(0.93);
    }

    .btn-maps:hover {
      background: #1c78e0;
      box-shadow: 0 4px 12px rgba(37,140,251,0.5);
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-close:hover { background: rgba(255,255,255,0.28); }
    .btn-close:active { transform: rotate(90deg) scale(0.9); }

    /* Small loading ribbon shown while the AR engine boots */
    #boot-loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10000;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #boot-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid rgba(212,175,55,0.25);
      border-top-color: var(--gold);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #boot-loader span {
      color: var(--gold-soft);
      font-size: 13px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Lightweight boot loader so the first paint isn't a blank black screen -->
  <div id="boot-loader">
    <div class="loader-ring"></div>
    <span>Starting camera…</span>
  </div>

  <div id="ui-container">
    <div class="scan-pill" id="scanPrompt">Point Camera at Ooty Card</div>

    <!-- Screen Navigation Dock -->
    <div id="active-info-bar">
      <div>
        <div id="info-title">Location Name</div>
        <div id="info-time" style="font-size: 11px; color: #b4c2b8;">Drive time: --</div>
      </div>
      <a id="mapsLink" href="#" target="_blank" class="btn-maps">🧭 Directions</a>
      <button class="btn-close" onclick="closeActiveSpot()">✕</button>
    </div>
  </div>

  <!-- MindAR Scene -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets/card.mind; autoStart: true; filterMinCF:0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- ALL MEDIA TEXTURES DECLARED HERE -->
    <a-assets>
      <img id="pinIcon" src="https://cdn-icons-png.flaticon.com/512/684/684908.png" crossorigin="anonymous">
      <video id="arVideo"
             crossOrigin="anonymous"
             playsinline
             webkit-playsinline
             preload="auto"
             loop
             muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable">
    </a-camera>

    <!-- Target Entity -->
    <a-entity id="cardTarget" mindar-image-target="targetIndex: 0">

      <!-- ================= 1. THE FLOATING 3D BILLBOARD SCREEN ================= -->
      <a-entity id="videoScreenGroup" position="0 0.58 0.12" rotation="15 0 0" scale="0.01 0.01 0.01" visible="false">

        <!-- Outer Dark Forest Green Backing -->
        <a-plane position="0 0.03 -0.01" width="0.86" height="0.58" color="#081c10" material="opacity: 1; roughness: 0.8; metalness: 0.2"></a-plane>

        <!-- Outer Gold Trim -->
        <a-plane position="0 0.03 -0.008" width="0.84" height="0.56" color="#d4af37" material="opacity: 0.9"></a-plane>

        <!-- Inner Bezel (Matte Black Screen Well) -->
        <a-plane position="0 0.05 -0.005" width="0.74" height="0.425" color="#000000" material="opacity: 1"></a-plane>

        <!-- Video Surface (Strictly bound inside the black bezel with flat shader) -->
        <a-video id="videoPlane" src="#arVideo" width="0.72" height="0.405" position="0 0.05 0.005" material="shader: flat;"></a-video>

        <!-- Header Banner -->
        <a-plane position="0 0.27 0.01" width="0.80" height="0.06" color="#0d2818" material="opacity: 0.98">
          <a-text id="arVideoTitle" value="LOCATION TITLE" align="center" color="#f3e5ab" width="1.1" baseline="center"></a-text>
        </a-plane>

        <!-- Dynamic AR PLAY / PAUSE Toggle Button -->
        <a-plane id="arPlayPauseBtn" class="clickable" position="-0.16 -0.20 0.02" width="0.38" height="0.07" color="#27ae60"
                 animation__idle="property: scale; dir: alternate; dur: 1200; loop: true; easing: easeInOutSine; to: 1.04 1.04 1.04">
          <a-text id="playPauseText" value="▶ PLAY VIDEO" align="center" color="#ffffff" width="1.1"></a-text>
        </a-plane>

        <!-- Close Button -->
        <a-plane id="arCloseBtn" class="clickable" position="0.22 -0.20 0.02" width="0.26" height="0.07" color="#c0392b">
          <a-text value="✕ CLOSE" align="center" color="#ffffff" width="1.05"></a-text>
        </a-plane>

        <!-- Structural Billboard Anchors -->
        <a-cylinder position="-0.34 -0.34 -0.02" radius="0.006" height="0.28" color="#d4af37" opacity="0.85"></a-cylinder>
        <a-cylinder position="0.34 -0.34 -0.02" radius="0.006" height="0.28" color="#d4af37" opacity="0.85"></a-cylinder>
      </a-entity>

      <!-- ================= 2. INTERACTIVE HOTSPOT BUTTONS ON CARD ================= -->
      <a-plane class="clickable spot-btn" data-id="ooty_lake" position="-0.04 0.18 0.03" width="0.26" height="0.07" color="#081c10" material="opacity: 0.85"
               animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 1.06 1.06 1.06; delay: 0">
        <a-text value="Ooty Lake\n(13 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="pykara" position="-0.52 0.16 0.03" width="0.28" height="0.08" color="#081c10" material="opacity: 0.85"
               animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 1.06 1.06 1.06; delay: 200">
        <a-text value="Pykara Lake\n(55 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="rose_garden" position="-0.32 -0.10 0.03" width="0.25" height="0.07" color="#081c10" material="opacity: 0.85"
               animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 1.06 1.06 1.06; delay: 400">
        <a-text value="Rose Garden\n(4 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="botanical_garden" position="-0.33 -0.22 0.03" width="0.27" height="0.07" color="#081c10" material="opacity: 0.85"
               animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 1.06 1.06 1.06; delay: 600">
        <a-text value="Botanical Garden\n(5 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="murugan_temple" position="-0.28 -0.38 0.03" width="0.27" height="0.07" color="#081c10" material="opacity: 0.85"
               animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 1.06 1.06 1.06; delay: 800">
        <a-text value="Murugan Temple\n(8 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="govt_museum" position="0.21 0.08 0.03" width="0.28" height="0.07" color="#081c10" material="opacity: 0.85"
               animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 1.06 1.06 1.06; delay: 1000">
        <a-text value="Govt Museum\n(4 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="doddabetta" position="0.38 -0.08 0.03" width="0.28" height="0.07" color="#081c10" material="opacity: 0.85"
               animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 1.06 1.06 1.06; delay: 1200">
        <a-text value="Doddabetta Peak\n(35 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="pine_forest" position="0.28 -0.38 0.03" width="0.26" height="0.07" color="#081c10" material="opacity: 0.85"
               animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 1.06 1.06 1.06; delay: 1400">
        <a-text value="Pine Forest\n(35 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="avalanche" position="0.55 -0.01 0.03" width="0.27" height="0.07" color="#081c10" material="opacity: 0.85"
               animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 1.06 1.06 1.06; delay: 1600">
        <a-text value="Avalanche Lake\n(1 hr 15 min)" align="center" color="#f3e5ab" width="0.62"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="mudumalai" position="0.52 0.28 0.03" width="0.28" height="0.07" color="#081c10" material="opacity: 0.85"
               animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 1.06 1.06 1.06; delay: 1800">
        <a-text value="Mudumalai Park\n(1 hr 20 min)" align="center" color="#f3e5ab" width="0.62"></a-text>
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    const PLACES = {
      ooty_lake: {
        title: "Ooty Lake & Boathouse",
        time: "13 min (2.4 km)",
        video: "ooty/Ooty_Lake.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Ooty+Lake+Boathouse"
      },
      pykara: {
        title: "Pykara Waterfalls & Lake",
        time: "55 min (21 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Pykara+Waterfalls"
      },
      rose_garden: {
        title: "Government Rose Garden",
        time: "4 min (0.6 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Government+Rose+Garden+Ooty"
      },
      botanical_garden: {
        title: "Government Botanical Garden",
        time: "5 min (0.8 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyBlazes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Government+Botanical+Garden+Ooty"
      },
      murugan_temple: {
        title: "Elk Hill Murugan Temple",
        time: "8 min (1.4 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Elk+Hill+Murugan+Temple+Ooty"
      },
      govt_museum: {
        title: "Government Museum Ooty",
        time: "4 min (0.7 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Government+Museum+Ooty"
      },
      doddabetta: {
        title: "Doddabetta Peak Observatory",
        time: "35 min (9.5 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Doddabetta+Peak"
      },
      pine_forest: {
        title: "Pine Forest (Shooting Spot)",
        time: "35 min (10 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyBlazes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Pine+Forest+Ooty"
      },
      avalanche: {
        title: "Avalanche Lake Checkpoint",
        time: "1 hr 15 min (25 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Avalanche+Lake+Ooty"
      },
      mudumalai: {
        title: "Mudumalai Tiger Reserve",
        time: "1 hr 20 min (37 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Mudumalai+National+Park"
      }
    };

    const videoEl = document.getElementById('arVideo');
    const screenGroup = document.getElementById('videoScreenGroup');
    const arTitle = document.getElementById('arVideoTitle');
    const playPauseBtn = document.getElementById('arPlayPauseBtn');
    const playPauseText = document.getElementById('playPauseText');
    const bottomBar = document.getElementById('active-info-bar');
    const infoTitle = document.getElementById('info-title');
    const infoTime = document.getElementById('info-time');
    const mapsLink = document.getElementById('mapsLink');
    const bootLoader = document.getElementById('boot-loader');

    // Hide the boot loader once the AR scene has rendered its first frame
    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener('renderstart', () => {
      bootLoader.classList.add('hidden');
    });
    // Fallback in case renderstart doesn't fire quickly
    setTimeout(() => bootLoader.classList.add('hidden'), 4000);

    // Little scale "pop" used for tap feedback on any clickable a-plane
    function popFeedback(el) {
      el.removeAttribute('animation__pop');
      el.setAttribute('animation__pop', {
        property: 'scale',
        from: '0.85 0.85 0.85',
        to: '1 1 1',
        dur: 220,
        easing: 'easeOutBack'
      });
    }

    // Attach click listeners to landmark buttons
    document.querySelectorAll('.spot-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const data = PLACES[id];
        if (!data) return;

        popFeedback(btn);

        // 1. Stage the video in paused state
        videoEl.pause();
        videoEl.src = data.video;
        videoEl.load();

        // 2. Reset the AR Play button to "PLAY" state
        playPauseBtn.setAttribute('color', '#27ae60');
        playPauseText.setAttribute('value', '▶ PLAY VIDEO');

        // 3. Show billboard with a spring-in pop animation
        arTitle.setAttribute('value', data.title);
        screenGroup.setAttribute('visible', 'true');
        screenGroup.removeAttribute('animation__show');
        screenGroup.setAttribute('animation__show', {
          property: 'scale',
          from: '0.05 0.05 0.05',
          to: '1 1 1',
          dur: 420,
          easing: 'easeOutElastic'
        });

        // 4. Slide the bottom info dock into view
        infoTitle.innerText = data.title;
        infoTime.innerText = "Drive time: " + data.time;
        mapsLink.href = data.maps;
        bottomBar.classList.add('active');
      });
    });

    // AR Play / Pause Toggle Button Handler
    playPauseBtn.addEventListener('click', () => {
      popFeedback(playPauseBtn);
      if (videoEl.paused) {
        videoEl.muted = false;
        videoEl.play().then(() => {
          playPauseBtn.setAttribute('color', '#e67e22');
          playPauseText.setAttribute('value', '❚❚ PAUSE');
        }).catch(err => {
          videoEl.muted = true;
          videoEl.play();
          playPauseBtn.setAttribute('color', '#e67e22');
          playPauseText.setAttribute('value', '❚❚ PAUSE');
        });
      } else {
        videoEl.pause();
        playPauseBtn.setAttribute('color', '#27ae60');
        playPauseText.setAttribute('value', '▶ PLAY VIDEO');
      }
    });

    // Close button — animate the billboard shrinking away before hiding it
    function closeActiveSpot() {
      videoEl.pause();

      screenGroup.removeAttribute('animation__hide');
      screenGroup.setAttribute('animation__hide', {
        property: 'scale',
        to: '0.01 0.01 0.01',
        dur: 220,
        easing: 'easeInBack'
      });
      setTimeout(() => screenGroup.setAttribute('visible', 'false'), 220);

      bottomBar.classList.remove('active');
      playPauseBtn.setAttribute('color', '#27ae60');
      playPauseText.setAttribute('value', '▶ PLAY VIDEO');
    }

    document.getElementById('arCloseBtn').addEventListener('click', () => {
      popFeedback(document.getElementById('arCloseBtn'));
      closeActiveSpot();
    });

    // Target tracking events
    const cardTarget = document.getElementById('cardTarget');
    const scanPrompt = document.getElementById('scanPrompt');

    cardTarget.addEventListener("targetFound", () => {
      scanPrompt.innerText = "Card Locked! Tap any spot to view details";
      scanPrompt.style.background = "rgba(46, 125, 50, 0.9)";
      scanPrompt.classList.remove('locked');
      // restart the pulse animation
      void scanPrompt.offsetWidth;
      scanPrompt.classList.add('locked');
    });

    cardTarget.addEventListener("targetLost", () => {
      scanPrompt.innerText = "Point Camera at Ooty Card";
      scanPrompt.style.background = "rgba(8, 28, 16, 0.9)";
      scanPrompt.classList.remove('locked');
      videoEl.pause();
      playPauseBtn.setAttribute('color', '#27ae60');
      playPauseText.setAttribute('value', '▶ PLAY VIDEO');
    });
  </script>
</body>
</html>
