<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ooty AR Smart Concierge</title>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
    }

    /* CRITICAL FIX: Hide the raw HTML video element off-screen completely */
    #arVideo {
      position: absolute !important;
      top: -9999px !important;
      left: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      z-index: -9999 !important;
    }

    /* Screen UI Overlay */
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      pointer-events: none;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
    }

    .scan-pill {
      background: rgba(8, 28, 16, 0.9);
      border: 1.5px solid #d4af37;
      color: #f3e5ab;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    /* Screen fallback dock for Maps navigation */
    #active-info-bar {
      position: fixed;
      bottom: 24px;
      background: rgba(8, 28, 16, 0.95);
      border: 1.5px solid #d4af37;
      border-radius: 14px;
      padding: 10px 16px;
      display: none;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    #info-title {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .btn-maps {
      background: #258cfb;
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <div class="scan-pill" id="scanPrompt">Point Camera at Ooty Card</div>

    <!-- Screen Navigation Dock -->
    <div id="active-info-bar">
      <div>
        <div id="info-title">Location Name</div>
        <div id="info-time" style="font-size: 11px; color: #b4c2b8;">Drive time: --</div>
      </div>
      <a id="mapsLink" href="#" target="_blank" class="btn-maps">🧭 Directions</a>
      <button class="btn-close" onclick="closeActiveSpot()">✕</button>
    </div>
  </div>

  <!-- HTML5 Video element configured for iOS texture extraction (completely invisible in 2D DOM) -->
  <video id="arVideo" crossOrigin="anonymous" playsinline webkit-playsinline preload="auto" loop muted></video>

  <!-- MindAR Scene -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets/card.mind; autoStart: true; filterMinCF:0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="pinIcon" src="https://cdn-icons-png.flaticon.com/512/684/684908.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable">
    </a-camera>

    <!-- Target Entity -->
    <a-entity id="cardTarget" mindar-image-target="targetIndex: 0">

      <!-- ================= 1. THE FLOATING 3D BILLBOARD SCREEN ================= -->
      <a-entity id="videoScreenGroup" position="0 0.58 0.12" rotation="15 0 0" visible="false">
        
        <!-- Outer Dark Forest Green Backing -->
        <a-plane position="0 0.03 -0.01" width="0.86" height="0.58" color="#081c10" material="opacity: 1; roughness: 0.8; metalness: 0.2"></a-plane>

        <!-- Outer Gold Trim -->
        <a-plane position="0 0.03 -0.008" width="0.84" height="0.56" color="#d4af37" material="opacity: 0.9"></a-plane>

        <!-- Inner Bezel (Matte Black Screen Well) -->
        <a-plane position="0 0.05 -0.005" width="0.74" height="0.425" color="#000000" material="opacity: 1"></a-plane>

        <!-- Video Surface (Strictly bound inside the black bezel) -->
        <a-video id="videoPlane" src="#arVideo" width="0.72" height="0.405" position="0 0.05 0.005"></a-video>
        
        <!-- Header Banner -->
        <a-plane position="0 0.27 0.01" width="0.80" height="0.06" color="#0d2818" material="opacity: 0.98">
          <a-text id="arVideoTitle" value="LOCATION TITLE" align="center" color="#f3e5ab" width="1.1" baseline="center"></a-text>
        </a-plane>

        <!-- Dynamic AR PLAY / PAUSE Toggle Button -->
        <a-plane id="arPlayPauseBtn" class="clickable" position="-0.16 -0.20 0.02" width="0.38" height="0.07" color="#27ae60">
          <a-text id="playPauseText" value="▶ PLAY VIDEO" align="center" color="#ffffff" width="1.1"></a-text>
        </a-plane>

        <!-- Close Button -->
        <a-plane id="arCloseBtn" class="clickable" position="0.22 -0.20 0.02" width="0.26" height="0.07" color="#c0392b">
          <a-text value="✕ CLOSE" align="center" color="#ffffff" width="1.05"></a-text>
        </a-plane>

        <!-- Structural Billboard Anchors -->
        <a-cylinder position="-0.34 -0.34 -0.02" radius="0.006" height="0.28" color="#d4af37" opacity="0.85"></a-cylinder>
        <a-cylinder position="0.34 -0.34 -0.02" radius="0.006" height="0.28" color="#d4af37" opacity="0.85"></a-cylinder>
      </a-entity>

      <!-- ================= 2. INTERACTIVE HOTSPOT BUTTONS ON CARD ================= -->
      <a-plane class="clickable spot-btn" data-id="ooty_lake" position="-0.04 0.18 0.03" width="0.26" height="0.07" color="#081c10" material="opacity: 0.85">
        <a-text value="Ooty Lake\n(13 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="pykara" position="-0.52 0.16 0.03" width="0.28" height="0.08" color="#081c10" material="opacity: 0.85">
        <a-text value="Pykara Lake\n(55 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="rose_garden" position="-0.32 -0.10 0.03" width="0.25" height="0.07" color="#081c10" material="opacity: 0.85">
        <a-text value="Rose Garden\n(4 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="botanical_garden" position="-0.33 -0.22 0.03" width="0.27" height="0.07" color="#081c10" material="opacity: 0.85">
        <a-text value="Botanical Garden\n(5 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="murugan_temple" position="-0.28 -0.38 0.03" width="0.27" height="0.07" color="#081c10" material="opacity: 0.85">
        <a-text value="Murugan Temple\n(8 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="govt_museum" position="0.21 0.08 0.03" width="0.28" height="0.07" color="#081c10" material="opacity: 0.85">
        <a-text value="Govt Museum\n(4 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="doddabetta" position="0.38 -0.08 0.03" width="0.28" height="0.07" color="#081c10" material="opacity: 0.85">
        <a-text value="Doddabetta Peak\n(35 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="pine_forest" position="0.28 -0.38 0.03" width="0.26" height="0.07" color="#081c10" material="opacity: 0.85">
        <a-text value="Pine Forest\n(35 min)" align="center" color="#f3e5ab" width="0.65"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="avalanche" position="0.55 -0.01 0.03" width="0.27" height="0.07" color="#081c10" material="opacity: 0.85">
        <a-text value="Avalanche Lake\n(1 hr 15 min)" align="center" color="#f3e5ab" width="0.62"></a-text>
      </a-plane>

      <a-plane class="clickable spot-btn" data-id="mudumalai" position="0.52 0.28 0.03" width="0.28" height="0.07" color="#081c10" material="opacity: 0.85">
        <a-text value="Mudumalai Park\n(1 hr 20 min)" align="center" color="#f3e5ab" width="0.62"></a-text>
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    const PLACES = {
      ooty_lake: {
        title: "Ooty Lake & Boathouse",
        time: "13 min (2.4 km)",
        video: "ooty/Ooty_Lake.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Ooty+Lake+Boathouse"
      },
      pykara: {
        title: "Pykara Waterfalls & Lake",
        time: "55 min (21 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Pykara+Waterfalls"
      },
      rose_garden: {
        title: "Government Rose Garden",
        time: "4 min (0.6 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Government+Rose+Garden+Ooty"
      },
      botanical_garden: {
        title: "Government Botanical Garden",
        time: "5 min (0.8 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyBlazes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Government+Botanical+Garden+Ooty"
      },
      murugan_temple: {
        title: "Elk Hill Murugan Temple",
        time: "8 min (1.4 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Elk+Hill+Murugan+Temple+Ooty"
      },
      govt_museum: {
        title: "Government Museum Ooty",
        time: "4 min (0.7 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Government+Museum+Ooty"
      },
      doddabetta: {
        title: "Doddabetta Peak Observatory",
        time: "35 min (9.5 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Doddabetta+Peak"
      },
      pine_forest: {
        title: "Pine Forest (Shooting Spot)",
        time: "35 min (10 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyBlazes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Pine+Forest+Ooty"
      },
      avalanche: {
        title: "Avalanche Lake Checkpoint",
        time: "1 hr 15 min (25 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Avalanche+Lake+Ooty"
      },
      mudumalai: {
        title: "Mudumalai Tiger Reserve",
        time: "1 hr 20 min (37 km)",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        maps: "https://www.google.com/maps/dir/?api=1&destination=Mudumalai+National+Park"
      }
    };

    const videoEl = document.getElementById('arVideo');
    const screenGroup = document.getElementById('videoScreenGroup');
    const arTitle = document.getElementById('arVideoTitle');
    const playPauseBtn = document.getElementById('arPlayPauseBtn');
    const playPauseText = document.getElementById('playPauseText');
    const bottomBar = document.getElementById('active-info-bar');
    const infoTitle = document.getElementById('info-title');
    const infoTime = document.getElementById('info-time');
    const mapsLink = document.getElementById('mapsLink');

    // Attach click listeners to landmark buttons
    document.querySelectorAll('.spot-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const data = PLACES[id];
        if (!data) return;

        // 1. Stage the video in paused state
        videoEl.pause();
        videoEl.src = data.video;
        videoEl.load();

        // 2. Reset the AR Play button to "PLAY" state
        playPauseBtn.setAttribute('color', '#27ae60');
        playPauseText.setAttribute('value', '▶ PLAY VIDEO');

        // 3. Show billboard & info dock
        arTitle.setAttribute('value', data.title);
        screenGroup.setAttribute('visible', 'true');

        infoTitle.innerText = data.title;
        infoTime.innerText = "Drive time: " + data.time;
        mapsLink.href = data.maps;
        bottomBar.style.display = 'flex';
      });
    });

    // AR Play / Pause Toggle Button Handler
    playPauseBtn.addEventListener('click', () => {
      if (videoEl.paused) {
        // Unmute if user explicitly pressed play
        videoEl.muted = false;
        videoEl.play().then(() => {
          playPauseBtn.setAttribute('color', '#e67e22');
          playPauseText.setAttribute('value', '❚❚ PAUSE');
        }).catch(err => {
          // If iOS blocks audio unmuting without user setting, fallback to muted play
          videoEl.muted = true;
          videoEl.play();
          playPauseBtn.setAttribute('color', '#e67e22');
          playPauseText.setAttribute('value', '❚❚ PAUSE');
        });
      } else {
        videoEl.pause();
        playPauseBtn.setAttribute('color', '#27ae60');
        playPauseText.setAttribute('value', '▶ PLAY VIDEO');
      }
    });

    // Close button
    function closeActiveSpot() {
      videoEl.pause();
      screenGroup.setAttribute('visible', 'false');
      bottomBar.style.display = 'none';
      playPauseBtn.setAttribute('color', '#27ae60');
      playPauseText.setAttribute('value', '▶ PLAY VIDEO');
    }

    document.getElementById('arCloseBtn').addEventListener('click', closeActiveSpot);

    // Target tracking events
    const cardTarget = document.getElementById('cardTarget');
    const scanPrompt = document.getElementById('scanPrompt');

    cardTarget.addEventListener("targetFound", () => {
      scanPrompt.innerText = "Card Locked! Tap any spot to view details";
      scanPrompt.style.background = "rgba(46, 125, 50, 0.9)";
    });

    cardTarget.addEventListener("targetLost", () => {
      scanPrompt.innerText = "Point Camera at Ooty Card";
      scanPrompt.style.background = "rgba(8, 28, 16, 0.9)";
      videoEl.pause();
      playPauseBtn.setAttribute('color', '#27ae60');
      playPauseText.setAttribute('value', '▶ PLAY VIDEO');
    });
  </script>
</body>
</html>
